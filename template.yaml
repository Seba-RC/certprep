AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CertPrep - certification practice exam platform. Static site on S3 + CloudFront (OAC),
  with optional cross-device progress sync (Cognito + API Gateway HTTP API + Lambda + DynamoDB).

Metadata:
  cfn-lint:
    config:
      ignore_checks: [W1030]  # AuthDomainPrefix defaults to "" on purpose; the DomainPrefixRequired rule blocks it when sync is on

Parameters:
  EnableSync:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Deploy the optional sign-in and cloud sync backend. With "false" you get only the static site.
  AuthDomainPrefix:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    Description: >
      Globally unique prefix for the Cognito sign-in domain (for example certprep-yourname-2026).
      Required when EnableSync is "true". It can't contain the words aws, amazon, or cognito.
  PriceClass:
    Type: String
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Default: PriceClass_100
    Description: CloudFront edge locations. PriceClass_100 (North America + Europe) is cheapest.
  LocalDevOrigin:
    Type: String
    Default: http://localhost:8765
    Description: Extra origin allowed for sign-in redirects and CORS while developing locally.

Conditions:
  SyncEnabled: !Equals [!Ref EnableSync, "true"]

Rules:
  DomainPrefixRequired:
    RuleCondition: !Equals [!Ref EnableSync, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref AuthDomainPrefix, ""]]
        AssertDescription: AuthDomainPrefix is required when EnableSync is "true".

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  # ---------------------------------------------------------------- static site
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "CertPrep (${AWS::StackName})"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: config.json
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition:
              Bool: { aws:SecureTransport: "false" }

  # ---------------------------------------------------------------- sign-in (optional)
  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: SyncEnabled
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
          AttributeDataType: String

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: SyncEnabled
    Properties:
      Domain: !Ref AuthDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: SyncEnabled
    Properties:
      ClientName: certprep-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub "https://${Distribution.DomainName}/"
        - !Sub "${LocalDevOrigin}/"
      LogoutURLs:
        - !Sub "https://${Distribution.DomainName}/"
        - !Sub "${LocalDevOrigin}/"
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------------------------------------------------------------- sync API (optional)
  ProgressTable:
    Type: AWS::DynamoDB::Table
    Condition: SyncEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Condition: SyncEnabled
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${Distribution.DomainName}"
          - !Ref LocalDevOrigin
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, PUT, DELETE, OPTIONS]
        MaxAge: 3600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Condition: SyncEnabled
    Properties:
      Description: CertPrep progress sync API
      CodeUri: backend/src/
      Handler: handler.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ProgressTable
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !GetAtt ProgressTable.Arn
      Events:
        GetProgress:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: "/progress/{certId}" }
        PutProgress:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: PUT, Path: "/progress/{certId}" }
        DeleteProgress:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: "/progress/{certId}" }

  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Condition: SyncEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 14

Outputs:
  SiteUrl:
    Description: Your CertPrep site
    Value: !Sub "https://${Distribution.DomainName}/"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  ApiUrl:
    Condition: SyncEnabled
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CognitoDomain:
    Condition: SyncEnabled
    Value: !Sub "${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  UserPoolClientId:
    Condition: SyncEnabled
    Value: !Ref UserPoolClient
  UserPoolId:
    Condition: SyncEnabled
    Value: !Ref UserPool
