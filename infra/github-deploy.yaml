AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets GitHub Actions in one repository deploy the CertPrep stack, with no stored AWS keys.
  GitHub signs in through OpenID Connect (OIDC) and gets short-lived credentials for a narrow
  deploy role. Infrastructure changes run through a separate CloudFormation execution role
  that only CloudFormation can use, scoped to the app stack's resources.

Parameters:
  GitHubOwner:
    Type: String
    Default: Seba-RC
  GitHubRepo:
    Type: String
    Default: certprep
  GitHubOwnerId:
    Type: String
    Default: ""
    Description: >
      Numeric GitHub ID of the owner (api.github.com/repos/OWNER/REPO -> owner.id). GitHub can send
      the OIDC subject as repo:OWNER@OWNER_ID/REPO@REPO_ID:...; with both IDs set, that form is accepted too.
  GitHubRepoId:
    Type: String
    Default: ""
    Description: Numeric GitHub ID of the repository (api.github.com/repos/OWNER/REPO -> id).
  Branch:
    Type: String
    Default: main
    Description: Only workflows running on this branch can deploy.
  AppStackName:
    Type: String
    Default: certprep
    Description: Name of the CertPrep app stack that the workflow deploys.
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      An AWS account can hold only one GitHub OIDC provider. Use "false" if
      token.actions.githubusercontent.com already exists in IAM > Identity providers.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]
  HasIds: !And
    - !Not [!Equals [!Ref GitHubOwnerId, ""]]
    - !Not [!Equals [!Ref GitHubRepoId, ""]]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS validates GitHub's certificate itself; these are kept for older API expectations.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # SAM uploads the Lambda code and the processed template here before each deploy.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppStackName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30

  # Used by CloudFormation (not by GitHub) to create and update the app's resources.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppStackName}-cfn-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-certprep-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SiteBucket
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${AppStackName}-sitebucket-*"
                  - !Sub "arn:${AWS::Partition}:s3:::${AppStackName}-sitebucket-*/*"
              - Sid: ReadDeployArtifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "${ArtifactsBucket.Arn}/*"
              - Sid: CloudFront
                Effect: Allow
                Action: cloudfront:*
                Resource: "*"
              - Sid: Cognito
                Effect: Allow
                Action: cognito-idp:*
                Resource: "*"
              - Sid: ApiGateway
                Effect: Allow
                Action: apigateway:*
                Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/*"
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*"
              - Sid: DynamoDB
                Effect: Allow
                Action: dynamodb:*
                Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*"
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*:*"
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: LambdaExecutionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListRoleTags
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*"

  # Assumed by GitHub Actions. It can only start CloudFormation deploys (which run as the
  # execution role above), upload artifacts, publish the site, and invalidate CloudFront.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppStackName}-github-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # GitHub may send either subject format; the ID form survives renames and can't be
                # claimed by someone who later takes over the same owner/repo name.
                token.actions.githubusercontent.com:sub: !If
                  - HasIds
                  - - !Sub "repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${Branch}"
                    - !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/${Branch}"
                  - !Sub "repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${Branch}"
      Policies:
        - PolicyName: deploy-certprep
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DeployAppStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"
              - Sid: UseSamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: ValidateTemplates
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary]
                Resource: "*"
              - Sid: HandRoleToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: UploadArtifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub "${ArtifactsBucket.Arn}/*"
              - Sid: PublishSite
                Effect: Allow
                Action: [s3:ListBucket, s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${AppStackName}-sitebucket-*"
                  - !Sub "arn:${AWS::Partition}:s3:::${AppStackName}-sitebucket-*/*"
              - Sid: RefreshCdn
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*"

Outputs:
  DeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  ExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  AccountId:
    Description: Put this in the GitHub repo as the AWS_ACCOUNT_ID variable.
    Value: !Ref AWS::AccountId
